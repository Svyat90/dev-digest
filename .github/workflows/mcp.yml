# mcp suite — the MCP server (@devdigest/mcp), a thin stdio client over the
# Fastify REST API. Tests are hermetic units (the API is a fake fetch).
# Uses npm (package-lock.json).
name: mcp

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
